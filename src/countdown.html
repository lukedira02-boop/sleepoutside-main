<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practice JavaScript timers with a customizable countdown."
    />
    <title>Countdown Timer | SleepOutside</title>
    <link rel="stylesheet" href="css/countdown.css" />
    <script type="module" src="js/countdown.js"></script>
  </head>
  <body>
    <main class="timer-card">
      <a class="home-link" href="index.html">SleepOutside</a>
      <p class="eyebrow">JavaScript timer activity</p>
      <h1 id="countdown" aria-live="polite">00:10</h1>
      <p id="timerStatus" class="status" role="status">Ready when you are.</p>

      <form id="timerForm">
        <label for="startTime">Starting time in seconds</label>
        <input
          id="startTime"
          name="startTime"
          type="number"
          min="1"
          max="3600"
          step="1"
          value="10"
          required
        />
        <p class="hint">Choose a time from 1 to 3,600 seconds.</p>
        <div class="controls">
          <button id="startButton" type="submit">Start</button>
          <button id="pauseButton" type="button" disabled>Pause</button>
          <button id="resetButton" type="button" class="secondary-button">
            Reset
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
