<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main class="divider">
      <section class="products">
        <h2>Review &amp; Place Your Order</h2>
        <div class="checkout-layout">
          <form id="checkout-form" class="checkout-form">
            <fieldset>
              <legend>Customer information</legend>
              <label>
                First name
                <input type="text" name="fname" autocomplete="given-name" required />
              </label>
              <label>
                Last name
                <input type="text" name="lname" autocomplete="family-name" required />
              </label>
            </fieldset>

            <fieldset>
              <legend>Billing and shipping address</legend>
              <label>
                Street address
                <input type="text" name="street" autocomplete="street-address" required />
              </label>
              <label>
                City
                <input type="text" name="city" autocomplete="address-level2" required />
              </label>
              <label>
                State
                <input type="text" name="state" autocomplete="address-level1" required />
              </label>
              <label>
                ZIP code
                <input
                  id="zip"
                  type="text"
                  name="zip"
                  autocomplete="postal-code"
                  inputmode="numeric"
                  pattern="[0-9]{5}(-[0-9]{4})?"
                  required
                />
              </label>
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <label>
                Credit card number
                <input
                  type="text"
                  name="cardNumber"
                  autocomplete="cc-number"
                  inputmode="numeric"
                  pattern="[0-9]{13,19}"
                  required
                />
              </label>
              <label>
                Expiration date (MM/YY)
                <input
                  type="text"
                  name="expiration"
                  autocomplete="cc-exp"
                  placeholder="MM/YY"
                  pattern="(0[1-9]|1[0-2])/[0-9]{2,4}"
                  required
                />
              </label>
              <label>
                Security code
                <input
                  type="text"
                  name="code"
                  autocomplete="cc-csc"
                  inputmode="numeric"
                  pattern="[0-9]{3,4}"
                  required
                />
              </label>
            </fieldset>

            <button id="checkout-submit" type="submit">Place Order</button>
            <p id="checkout-message" class="status-message" role="status" aria-live="polite"></p>
          </form>

          <section class="checkout-summary" aria-label="Order summary">
            <h3>Order Summary</h3>
            <p>Items: <span id="item-count">0</span></p>
            <p>Subtotal: <strong id="subtotal">$0.00</strong></p>
            <p>Tax: <strong id="tax">$0.00</strong></p>
            <p>Shipping estimate: <strong id="shipping">$0.00</strong></p>
            <p>Order total: <strong id="order-total">$0.00</strong></p>
          </section>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
